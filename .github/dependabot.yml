version: 2
updates:
  # Root workspace - includes root package.json with dev tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group all dev dependencies together to reduce PR noise
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow major version updates to come separately for review
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  # Website workspace - Next.js application
  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group production dependencies separately from dev dependencies
    groups:
      production-dependencies:
        patterns:
          - "next"
          - "next-intl"
          - "react"
          - "react-dom"
          - "js-yaml"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@tailwindcss/*"
          - "eslint*"
          - "tailwindcss"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "website"

  # GitHub Actions - keep workflow actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all GitHub Actions together
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"

  # Dev Containers - monitor Features in main devcontainer configuration
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "devcontainer"

  # Docker - monitor base images in Alpine devcontainer Dockerfile
  - package-ecosystem: "docker"
    directory: "/.devcontainer/devcontainers/alpine"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "devcontainer"
