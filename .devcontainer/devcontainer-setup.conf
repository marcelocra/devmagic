# DevContainer Setup Configuration
#
# This file allows you to customize the devcontainer setup behavior.
# Uncomment and modify any variables you want to override from their defaults.
#
# NOTE: All variables are commented out by default, meaning the setup script
# will use its built-in defaults. To customize, uncomment the line and change
# the value.

# --- User Configuration ---
# Your dotfiles repository (format: "username/repo" or full GitHub URL)
# MCRA_DOTFILES_REPO="marcelocra/dotfiles"

# Directory where your projects are stored
# MCRA_PROJECTS="$HOME/prj"

# --- Setup Modes ---
# Quick mode: Skip heavy operations (zsh plugins, mise, system packages, pnpm)
# MCRA_SETUP_QUICK="false"

# Interactive mode: Prompt before each major operation
# MCRA_SETUP_INTERACTIVE="false"

# --- Component Toggles ---
# Clone/update dotfiles repository
# MCRA_SETUP_DOTFILES="true"

# Install zsh plugins (autosuggestions, syntax-highlighting)
# MCRA_SETUP_ZSH_PLUGINS="true"

# Install mise runtime version manager
# MCRA_SETUP_MISE="false"

# Setup 'e' editor launcher command
# MCRA_SETUP_EDITOR_LAUNCHER="true"

# Install system packages (tmux, fzf, git-lfs)
# MCRA_SETUP_SYSTEM_PACKAGES="true"

# Install pnpm and global npm packages
# MCRA_SETUP_PNPM="true"

# --- Global npm Packages ---
# Space-separated list of npm packages to install globally
# MCRA_NPM_INSTALL="@google/gemini-cli @anthropic-ai/claude-code @github/copilot"
