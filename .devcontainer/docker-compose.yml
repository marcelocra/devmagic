# DevMagic dev container, Docker Compose based.
#
# NOTE: This setup targets Docker. If you use Podman instead, building through
# the `build:` block can be unreliable; in that case build the image manually
# (e.g. `podman build -t localhost/my-dev:latest .devcontainer`) and replace
# `build:` below with `image: localhost/my-dev:latest`.
#
# COMPOSE_PROJECT_NAME comes from the `.env` file next to this one and MUST
# match your project folder name, so the workspace mount below lines up with
# `workspaceFolder` in devcontainer.json (see `.env.example`).
name: ${COMPOSE_PROJECT_NAME:-devmagic}

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: devmagic-dev:${COMPOSE_PROJECT_NAME:-devmagic}
    volumes:
      # Your project, mounted where devcontainer.json expects it.
      - ..:/workspaces/${COMPOSE_PROJECT_NAME:-devmagic}

      # Personal dotfiles from the host (optional). If the folder doesn't
      # exist on the host, Docker creates it empty — harmless, but remove this
      # line if you don't keep dotfiles there.
      - ${HOME}/.config/dotfiles:/home/node/.config/dotfiles

    # Mount a temporary in-memory filesystem (tmpfs) at /tmp inside the
    # container, with permissions set to allow read/write, execution, and
    # typical /tmp security settings (mode=1777 is the standard sticky-bit
    # permission). This ensures /tmp is fast, isolated, and gets wiped on
    # container restart.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    working_dir: /workspaces/${COMPOSE_PROJECT_NAME:-devmagic}
    hostname: ${COMPOSE_PROJECT_NAME:-devmagic}
    user: node # Default user of the image built from the Dockerfile.
    command: sleep infinity
    networks:
      - dev-network

  # ---------------------------------------------------------------------------
  # Optional auxiliary services.
  #
  # Nothing below starts by default: each service sits behind a Compose
  # profile. Start/stop them on demand, from the host or from a terminal
  # inside the dev container (the latter requires the docker-in-docker
  # feature — see devcontainer.json):
  #
  #   docker compose --profile postgres up -d
  #   docker compose --profile postgres down
  #
  # Services share the dev-network, so the dev container reaches them by
  # service name (e.g. postgres:5432, http://ollama:11434).
  # ---------------------------------------------------------------------------

  # Ollama for local AI/LLM development (GPU).
  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      # Mount host ollama folder to persist models across containers.
      - ${HOME}/.ollama:/root/.ollama-host:cached
    networks:
      - dev-network
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    # GPU support - requires the NVIDIA container runtime on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: [ai]

  # Ollama CPU-only version (alternative to the GPU version above).
  # Choose either 'ai' profile (GPU) OR 'ai-cpu' profile (CPU-only), not both.
  ollama-cpu:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11435:11434" # Different port to avoid conflict with GPU version.
    volumes:
      - ollama-data:/root/.ollama
      - ${HOME}/.ollama:/root/.ollama-host:cached
    networks:
      - dev-network
    profiles: [ai-cpu]

  # PostgreSQL for database experiments.
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devmagic
      - POSTGRES_PASSWORD=${DEVMAGIC_DB_PASSWORD:-DevTime2024!coding}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional: initialize database with custom script.
      # - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dev-network
    profiles: [postgres]

  # Redis for caching experiments.
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dev-network
    profiles: [redis]

  # MongoDB for document database experiments.
  mongodb:
    image: docker.io/library/mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=devmagic
      - MONGO_INITDB_ROOT_PASSWORD=${DEVMAGIC_DB_PASSWORD:-DevTime2024!coding}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - dev-network
    profiles: [mongodb]

  # MinIO for S3-compatible object storage experiments.
  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=devmagic
      - MINIO_ROOT_PASSWORD=${DEVMAGIC_DB_PASSWORD:-DevTime2024!coding}
    ports:
      - "9000:9000" # API.
      - "9001:9001" # Console.
    volumes:
      - minio-data:/data
    networks:
      - dev-network
    profiles: [minio]

# Named volumes persist data across container rebuilds and restarts. Only
# removed when running `docker compose down -v`. This section defines WHAT
# volumes exist; the services above define WHERE they're mounted.
volumes:
  ollama-data:
  postgres-data:
  redis-data:
  mongodb-data:
  minio-data:

networks:
  dev-network:
    # Bridge network: isolated network for container communication.
    driver: bridge
