# DevMagic dev container, Docker Compose based.
#
# Generated from templates/devcontainer/ in the DevMagic repo. The installer
# (https://devmagic.run/install) fills in your project folder name (sanitized
# to Docker Compose naming rules) here and in devcontainer.json, so the values
# that must match across the two files are always generated in sync. To change
# a shared value, regenerate with setup/generate.sh (or edit both files
# consistently by hand).
#
# NOTE: This setup targets Docker. If you use Podman instead, building through
# the `build:` block can be unreliable; in that case build the image manually
# (e.g. `podman build -t localhost/my-dev:latest .devcontainer`) and replace
# `build:` below with `image: localhost/my-dev:latest`.
name: "devmagic"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: devmagic-dev:devmagic
    volumes:
      # Your project, mounted where devcontainer.json expects it.
      - ..:/workspaces/devmagic

      # Personal dotfiles from the host (optional). If the folder doesn't
      # exist on the host, Docker creates it empty — harmless, but remove this
      # line if you don't keep dotfiles there.
      #
      # ${HOME}${USERPROFILE} is a cross-platform home path: exactly one of
      # them is set (HOME on Linux/macOS, USERPROFILE on Windows) and the
      # other expands to empty.
      - ${HOME}${USERPROFILE}/.config/dotfiles:/home/node/.config/dotfiles

      # Shell history shared across all containers and WSL. Pairs with
      # MCRA_HISTORY_DIR in devcontainer.json.
      # In WSL: ln -s /mnt/c/Users/{username}/OneDrive/shell_histories ~/.shell_histories
      # In Windows: mklink /J %USERPROFILE%\.shell_histories "%USERPROFILE%\OneDrive\shell_histories"
      - ${HOME}${USERPROFILE}/.shell_histories:/home/node/.shell_histories

      # Share Ollama models with the host (uncomment if you use Ollama).
      # - ${HOME}${USERPROFILE}/.ollama:/home/node/.ollama:cached

    # Mount a temporary in-memory filesystem (tmpfs) at /tmp inside the
    # container, with permissions set to allow read/write, execution, and
    # typical /tmp security settings (mode=1777 is the standard sticky-bit
    # permission). This ensures /tmp is fast, isolated, and gets wiped on
    # container restart.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    working_dir: /workspaces/devmagic
    hostname: "devmagic"
    user: "node" # Must exist in the image built from the Dockerfile.
    command: sleep infinity
    networks:
      - dev-network

  # ---------------------------------------------------------------------------
  # Auxiliary services (optional).
  #
  # Add any service you need next to the example below. Put it behind a
  # Compose profile so it never starts with the dev container — you bring it
  # up on demand from the host, at the project root:
  #
  #   docker compose -f .devcontainer/docker-compose.yml --profile postgres up -d
  #   docker compose -f .devcontainer/docker-compose.yml --profile postgres down
  #
  # Services on dev-network are reachable from the dev container by service
  # name (e.g. postgres:5432).
  # ---------------------------------------------------------------------------

  # Example: PostgreSQL. Uncomment (and the volume below) to use.
  # postgres:
  #   image: docker.io/library/postgres:16-alpine
  #   environment:
  #     - POSTGRES_DB=devdb
  #     - POSTGRES_USER=devmagic
  #     # Set DEVMAGIC_DB_PASSWORD in your shell to override the default.
  #     - POSTGRES_PASSWORD=${DEVMAGIC_DB_PASSWORD:-DevTime2024!coding}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - dev-network
  #   profiles: [postgres]

# Named volumes persist data across container rebuilds and restarts. Only
# removed when running `docker compose down -v`.
# volumes:
#   postgres-data:

networks:
  dev-network:
    # Bridge network: isolated network for container communication. Needed as
    # soon as you run more than one service (dev + a database, for example).
    driver: bridge
